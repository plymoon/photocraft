[package]
name = "overcast-engine-py"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Python bindings (PyO3) for the overcast-engine spike"

[lib]
name = "overcast_engine"
crate-type = ["cdylib"]

[dependencies]
engine = { package = "overcast-engine", path = ".." }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
serde_json = "1"
serde = "1"
